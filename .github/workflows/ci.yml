name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          args: --timeout=5m
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build -ldflags "-s -w" -o /tmp/arbiter ./cmd/arbiter
      - name: smoke
        run: |
          echo '{"session_id":"ci","cwd":"/tmp","hook_event_name":"PreToolUse","tool_name":"Read","tool_input":{"file_path":"/etc/hostname"}}' \
            | /tmp/arbiter hook pretool

  cross-compile:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o "arbiter-$GOOS-$GOARCH$ext" ./cmd/arbiter
          shasum -a 256 "arbiter-$GOOS-$GOARCH$ext" > "arbiter-$GOOS-$GOARCH$ext.sha256"
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            arbiter-${{ matrix.os }}-${{ matrix.arch }}*
