version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # The bug-finding core. Anything stricter we add when the codebase
    # is mature enough to keep up with it.
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Keep gosec but only at high-severity to avoid the 0644-vs-0600
    # bikeshed on config files.
    - gosec

  settings:
    gosec:
      severity: high
      excludes:
        # File permissions: 0644/0755 are appropriate for our shipped
        # config + scaffolded files. gosec wants 0600/0700 by default.
        - G306
        - G301
        - G302
        # Subprocess invocation in delegate_to is the whole point of
        # the tool; sanitization is the caller's job.
        - G204
        # We accept a couple of integer overflow false positives that
        # would clutter the diff to fix without value.
        - G115

  exclusions:
    rules:
      - linters: [gosec]
        path: _test\.go
