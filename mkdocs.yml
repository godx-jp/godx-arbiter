site_name: godx-arbiter
site_description: LLM-based decision arbiter for AI coding CLIs
site_url: https://godx-team.github.io/godx-arbiter
repo_url: https://github.com/godx-team/godx-arbiter
repo_name: godx-team/godx-arbiter
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Get started:
      - Install: INSTALL.md
      - CLI reference: CLI.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Configuration:
      - All config files: CONFIG.md
      - rules.md spec: RULES_SPEC.md
      - policy.yaml spec: POLICY_SPEC.md
      - Skills: SKILLS.md
  - How it works:
      - Architecture: ARCHITECTURE.md
      - Decision flow: DECISION_FLOW.md
      - Slow-path agent: AGENT.md
      - Eventlog: EVENTLOG.md
  - Orchestration:
      - arbiter run: RUN.md
  - Multi-CLI:
      - Adapters + proxy: MULTI_CLI.md
      - Model routing: MODEL_ROUTING.md
  - Integrations:
      - MCP tools: MCP_TOOLS.md
  - Project:
      - Roadmap: ROADMAP.md
      - Decisions log: DECISIONS.md
